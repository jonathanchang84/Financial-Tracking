name: Financial Tracking
options:
  bundleIdPrefix: com.jonathanchang
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  Financial Tracking:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: Financial Tracking
      - path: Sources/FinancialTrackingCore
    resources:
      - path: Financial Tracking/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanchang.FinancialTracking
        INFOPLIST_KEY_CFBundleDisplayName: Financial Tracking
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        GENERATE_INFOPLIST_FILE: YES
  Financial TrackingTests:
    type: bundle.unit-test
    platform: [iOS, macOS]
    sources:
      - path: Financial TrackingTests
      - path: Sources/FinancialTrackingCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES