name: Deploy financial-dashboard-pwa to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'financial-dashboard-pwa/**'
      - '.github/workflows/deploy-financial-dashboard-pwa.yml'
  workflow_dispatch:

# Two pushes in quick succession would otherwise race and deploy out of order.
concurrency:
  group: deploy-financial-dashboard-pwa
  cancel-in-progress: true

jobs:
  deploy:
    # Pinned rather than `ubuntu-latest`. GitHub migrates that label to Ubuntu 26
    # on 2026-10-19, and a new image can change Chromium's system libraries and
    # sandboxing, which would break the browser suite with no code change at all.
    # Revisit deliberately rather than inheriting the migration by surprise.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: financial-dashboard-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: financial-dashboard-pwa/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('financial-dashboard-pwa/package-lock.json') }}
      - run: npm ci
      # The browser smoke suite runs inside `validate`, so Chromium and its system
      # libraries have to be present before it. Cached because the download is
      # large and the version is pinned by package-lock.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
        # This workflow used to build and deploy with no tests at all, so a failing
        # suite could still reach production. Keeping CI and local identical means
        # "it passed on my machine" and "it passed in CI" cannot diverge.
        #
        # The four gate steps are separate on purpose. Run as one `validate` step,
        # a failure only says "validate failed" and the individual logs need
        # authentication to read; split out, the step name says which gate broke
        # and the output is on the run summary. `npm run validate` still runs the
        # same four in the same order, so local and CI stay equivalent.
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Functional tests (local Worker + D1)
        run: npm run test:functional
      - name: Browser smoke tests
        run: npm run test:browser
        env:
          # Must match the install step above, or the test process looks for the
          # browser in the default location and cannot find it.
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
      # An artifact upload used to sit here, looking for a Playwright report
      # directory. This project uses the `playwright` library under `node --test`
      # with no `playwright.config`, so no report is ever written and the upload
      # silently produced nothing. Failures are reported as `::error::`
      # annotations instead, which appear on the run page and need no log access.
      - name: Record the gate result on the run page
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Gate passed" >> "$GITHUB_STEP_SUMMARY"
            echo "Unit, build, functional (local Worker + D1) and browser smoke tests all passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Gate failed" >> "$GITHUB_STEP_SUMMARY"
            echo "See the error annotations on this run for the failing check." >> "$GITHUB_STEP_SUMMARY"
          fi
      # An unset secret arrives as an empty string, and wrangler's own error for
      # that is a 401 from the API with no mention of the missing variable. The
      # gate above this step already passed, so a failure here is authentication
      # and nothing else; saying which variable is missing turns a puzzle into
      # a one-line fix in repository settings.
      #
      # The token also needs the Account - Workers Scripts and D1 edit
      # permissions, or the deploy fails after authentication succeeds.
      #
      # The two secrets live under Settings > Secrets and variables > Actions.
      - run: npx wrangler deploy
        id: deployCheck
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Runs only when the deploy above failed, and separates the two reasons a
      # token can be rejected. An unset secret arrives as an empty string and
      # wrangler reports a bare 401 with no mention of the missing variable; both
      # variables being present instead points at the token's permissions. Without
      # this the failure is a 401 and nothing else.
      - name: Explain a failed deploy
        if: failure() && steps.deployCheck.outcome == 'failure'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing secret::CLOUDFLARE_API_TOKEN is not set in this repository. Add it under Settings > Secrets and variables > Actions."
          elif [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing secret::CLOUDFLARE_ACCOUNT_ID is not set. The value is 9acdcec8241759d3107256fca80447d4, and is now also in wrangler.toml."
          else
            echo "::error title=Credentials present but the deploy still failed::The token is most likely missing the Account - Workers Scripts and D1 edit permissions."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
