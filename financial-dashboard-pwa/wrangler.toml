# Cloudflare deployment configuration — static PWA only (free tier).
# - Cloudflare Workers Static Assets (`*.workers.dev`):
#   `wrangler deploy` serves ONLY `./dist`.
#   Never point the asset directory at the project root, or the dev
#   `/src/main.js` shell ships instead of the hashed `/assets/*` bundle.
name = "financial-tracking"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Free-tier friendly: pure static assets, no Functions, no cron, no Durable Objects.
# Build command: npm run build
# Build output directory: dist
