# Cloudflare Workers configuration: static PWA + application-owned API.
name = "financial-tracking"
main = "worker/index.js"
compatibility_date = "2025-01-01"
# Not a secret: an account id appears in every wrangler command and in the
# dashboard URL. It lives here rather than only in CI because deploying locally
# otherwise depends on being OAuth-logged-in, while CI authenticates with an API
# token, which carries no account of its own. Without it, `wrangler deploy` in CI
# cannot tell which account to deploy to.
account_id = "9acdcec8241759d3107256fca80447d4"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Let the Worker handle the API while the asset server handles the SPA.
run_worker_first = ["/api/*"]

[vars]
APP_URL = "https://financial-tracking.jonathanchang84.workers.dev"
AUTH_APP_NAME = "Financial Dashboard"
# Comma separated client IPs that skip auth rate limiting, so a flaky connection
# on the owner's own line cannot lock them out of their own app. Edit and
# redeploy when the address changes; no code change is needed. Each address is
# matched against the Cloudflare-supplied CF-Connecting-IP, so an entry is inert
# unless the request actually arrives through the Cloudflare edge. IPv6 is
# compared by value, so hex case and `::` compression do not matter.
RATE_LIMIT_ALLOWLIST = "86.180.178.35, 2a00:23c8:9194:3e01:e1e7:229d:30a5:8afc"

[[d1_databases]]
binding = "DB"
database_name = "financial-tracking"
database_id = "54d53dd3-7c3d-431e-8352-a4681a41b165"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "AUTH_RATE_LIMITER"
class_name = "AuthRateLimiter"

[[migrations]]
tag = "v1"
# Free-plan Durable Objects must use the SQLite backend.
new_sqlite_classes = ["AuthRateLimiter"]
